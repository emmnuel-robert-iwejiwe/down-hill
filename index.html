<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hill Climb - Emma Racing</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div id="game">

    <div class="hud">
        <div>🏁 Distance: <span id="distance">0</span>m</div>
        <div>🪙 Coins: <span id="coins">0</span></div>
        <div>⭐ Score: <span id="score">0</span></div>
        <div>⛽ Fuel: <span id="fuel">100</span>%</div>
        <div>🎯 Goal: <span id="goal">2000</span>m</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <button id="pauseButton" aria-label="Pause game">Ⅱ</button>

    <div id="countdown">3</div>

    <div id="pauseScreen">
        <h1>PAUSED</h1>
        <p>Press P or tap resume</p>
        <button id="resume">RESUME</button>
    </div>

    <div id="gameOver">
        <h1 id="endTitle">GAME OVER</h1>
        <p>Distance: <span id="finalDistance">0</span>m</p>
        <p>Coins: <span id="finalCoins">0</span></p>
        <p>Score: <span id="finalScore">0</span></p>
        <button id="restart">PLAY AGAIN</button>
    </div>

    <div class="controls">
        <button id="brake">◀</button>
        <button id="gas">▶</button>
    </div>

</div>

<script src="js/constants.js"></script>
<script src="js/state.js"></script>
<script src="js/assets.js"></script>
<script src="js/terrain.js"></script>
<script src="js/items.js"></script>
<script src="js/renderer.js"></script>
<script src="js/car.js"></script>
<script src="js/input.js"></script>
<script src="js/game.js"></script>
</body>
</html>
